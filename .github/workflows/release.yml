name: Build Desktop Apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 5.2.0) — used in the tag, release name, and file names"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.normalize.outputs.version }}
    steps:
      # npm version requires strict x.y.z semver; pad whatever the user typed
      # ("1.0" / "v5" / "5.2") out to that shape.
      - name: Normalize version
        id: normalize
        run: |
          version="${{ inputs.version }}"
          version="${version#v}"
          IFS='.' read -r major minor patch _ <<< "$version"
          version="${major:-0}.${minor:-0}.${patch:-0}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  mac:
    needs: prepare
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Set version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - run: npm run build

      - run: npx electron-builder --mac --publish never

      # "identity": null tells electron-builder to skip signing, which leaves the
      # bundle with no _CodeSignature seal — electron-builder renamed the binary and
      # rewrote Info.plist, so Electron's own linker signature no longer covers it.
      # Gatekeeper rejects that outright once the download is quarantined ("Paint is
      # damaged and can't be opened"). An ad-hoc signature makes the bundle valid.
      - name: Ad-hoc code sign
        run: |
          cd dist_electron/mac-arm64
          codesign --force --deep --sign - Paint.app
          codesign --verify --deep --strict --verbose=2 Paint.app

      # electron-builder's mac target is "dir" (unpacked .app), so zip it ourselves.
      # ditto preserves the bundle structure/resource forks the way macOS expects.
      - name: Zip app bundle
        run: |
          cd dist_electron/mac-arm64
          ditto -c -k --sequesterRsrc --keepParent Paint.app "../Paint-$VERSION-mac.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: dist_electron/Paint-${{ needs.prepare.outputs.version }}-mac.zip

  windows:
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Set version
        run: npm version "$env:VERSION" --no-git-tag-version --allow-same-version

      - run: npm run build

      - run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist_electron/Paint-Setup-${{ needs.prepare.outputs.version }}.exe
            dist_electron/Paint-${{ needs.prepare.outputs.version }}-win.zip

  release:
    needs: [prepare, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          draft: true
          files: |
            artifacts/mac-build/*
            artifacts/windows-build/*
