<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>untitled - Paint</title>
<link rel="icon" href="assets/web/favicon.ico" sizes="16x16 24x24 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="assets/web/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/web/favicon-16.png">
<link rel="apple-touch-icon" href="assets/web/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0053EE">
<meta name="apple-mobile-web-app-title" content="Paint">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="menubar"></div>
  <div id="middle">
    <div id="leftpanel">
      <div id="toolbox"></div>
      <div id="tooloptions" class="sunken-light"></div>
    </div>
    <div id="workspace"></div>
  </div>
  <div id="colorrow">
    <div id="colorbox"></div>
  </div>
  <div id="statusbar">
    <div class="sb-pane" id="sb-hint"></div>
    <div class="sb-pane sb-fixed" id="sb-pos"></div>
    <div class="sb-pane sb-fixed" id="sb-size"></div>
    <div id="sb-grip"></div>
  </div>
</div>
<div id="dialoghost"></div>
<script src="dist/renderer.js"></script>
</body>
</html>
