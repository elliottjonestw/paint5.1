<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>untitled - Paint</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="menubar"></div>
  <div id="middle">
    <div id="leftpanel">
      <div id="toolbox"></div>
      <div id="tooloptions" class="sunken-light"></div>
    </div>
    <div id="workspace"></div>
  </div>
  <div id="colorrow">
    <div id="colorbox"></div>
  </div>
  <div id="statusbar">
    <div class="sb-pane" id="sb-hint"></div>
    <div class="sb-pane sb-fixed" id="sb-pos"></div>
    <div class="sb-pane sb-fixed" id="sb-size"></div>
    <div id="sb-grip"></div>
  </div>
</div>
<div id="dialoghost"></div>
<script src="dist/renderer.js"></script>
</body>
</html>
